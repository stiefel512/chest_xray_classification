experiment:
  name: resnet18_xray
  seed: 42
  output_dir: experiments/resnet18_experiment2
data:
  src_dir: /home/avis/data/kaggle/chest_x_ray
  data_dir: data/NIH_Chest_X_Rays
  pathology: Pneumonia
  dataset_size: 8000
  train_test_split: 0.2
  train_val_split: 0.2
  input_size:
  - 1
  - 224
  - 224
  batch_size: 256
  num_workers: 16
  augmentations:
    rotations:
      enabled: false
      max_angle: 7
    horizontal_flip:
      enabled: false
      p: 0.0001
    contrast_jitter:
      enabled: false
      contrast: 0.05
model:
  architecture: resnet18
  pretrained: false
  base_channels: 64
  norm: batch_size
  num_groups: 32
optimizer:
  type: SGD
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
scheduler:
  type: cosine
  cosine_schedule:
    eta_min: 1.0e-06
  step_schedule:
    step_size: 30
    gamma: 0.1
  warmup:
    epochs: 5
    start_factor: 0.001
training:
  max_epochs: 200
  precision: 32
  log_every_n_steps: 50
  val_interval: 1
  weighted_loss: true
regularization:
  label_smoothing: 0.0
  dropout: 0.0
evaluation:
  specificity: 0.9
  accuracy_threshold: 0.5
